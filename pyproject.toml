[project]
name = "rag-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
    "ipykernel>=7.4.0",
    "langchain>=0.3.0",
    "langchain-community>=0.4.2",
    "langchain-mongodb>=0.2.0",
    "langchain-openai>=0.2.0",
    "langchain-unstructured>=1.0.1",
    "pymongo>=4.6.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
rag-project = "rag_project:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
